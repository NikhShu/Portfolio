shortBio: >-
  Entry-Level Software Engineer with strong foundations in Data Structures &
  Algorithms, Java, Python, SQL, Linux/Unix, Distributed Systems, and Cloud
  Technologies (AWS/GCP). Hands-on experience building backend applications,
  database-driven solutions, and scalable cloud-based systems.
longBio: >
  I'm a Software Engineer at Ethara.AI, specializing in LLM post-training,
  agentic systems, and AI evaluation engineering. I build the infrastructure
  that enables AI agents to be generated, executed, evaluated, and validated
  across complex multi-turn and long-horizon tasks, using Python, PyTest, AWS,
  Docker, Linux, and Git/GitHub.


  My broader AI/ML experience spans machine learning, computer vision,
  multimodal AI, and intelligent systems. I've worked on CNN-based computer
  vision systems, multimodal deepfake detection, posture and attention analysis,
  and data-processing pipelines, with a focus on translating ML concepts into
  practical, deployable applications.


  I also hold a published patent for “Analytical Posture Modelling for
  Personalized Curriculum Optimization” (202511063027), focused on AI-based
  posture classification and behavioral analysis for personalized student
  performance insights.


  Beyond AI/ML, I have strong foundations in software engineering and systems
  development, including DSA, OOPs, System Design, REST APIs, backend
  development, databases, testing, Git, Docker, cloud infrastructure, and
  distributed systems. I enjoy working at the intersection of AI and software
  engineering, building systems that are scalable, testable, maintainable, and
  reliable in real-world environments.
personalMission: >-
  To engineer AI systems that are not just intelligent, but reliable, scalable,
  and accessible — bridging the gap between cutting-edge research and real-world
  impact.
elevatorPitch: >-
  I'm Nikhil Shukla, an AI/ML Engineer who builds production-ready systems at
  the intersection of computer vision, deep learning, and software engineering.
  I've developed real-time pose detection systems using OpenPose-inspired
  architectures, built multimodal deepfake detectors, and published a patent on
  AI-driven curriculum optimization. I combine strong software engineering
  fundamentals with specialized AI/ML expertise to build systems that work
  reliably at scale.
valueProposition: >-
  I bridge the gap between AI research and production engineering. With
